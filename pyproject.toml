[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "segpilot"
version = "0.1.0"
description = "Adaptive SEG-level compression control plane for Paritok — decides how hard to compress, and proves it was safe."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "SEGPILOT contributors" }]

dependencies = [
    "paritok[proxy]>=1.2.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
segpilot = "segpilot.cli:main"

[tool.setuptools.packages.find]
include = ["segpilot*", "agent*", "bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
